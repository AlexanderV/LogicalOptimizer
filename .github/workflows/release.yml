name: Release

# Publishes the LogicalOptimizer packages (the consolidated library, the CLI tool, and the
# seven deprecated forwarding shells) when a version tag (v1.2.3) is pushed.
# Uses nuget.org Trusted Publishing (OIDC):
# no stored API key. One-time setup: create a trusted-publishing policy on nuget.org
# (Repository Owner + Repository + Workflow File = release.yml) and set the NUGET_USER
# repository variable to your nuget.org profile name (not your email).
#
# DRY RUN: manual dispatch runs the ENTIRE pre-publish sequence — build, tests, evidence
# sweeps, pack, contract audit, local install + Native AOT smoke, checksums, the -RequireAll
# evidence gate — and then STOPS: no attestation, no push, nothing irreversible. That is how
# the release pipeline is verified end-to-end on a real Linux runner without publishing;
# the version comes from Directory.Build.props instead of a tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    # A hung test or publish step must fail visibly, not hold the release open for hours.
    timeout-minutes: 60
    permissions:
      id-token: write      # OIDC token issuance for Trusted Publishing + provenance signing
      contents: write      # checkout + attach the evidence bundle to this tag's release
      attestations: write  # build provenance attestations for the published packages
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      # PUBLISH gates every irreversible step: true only for a real tag push. A manual
      # dispatch is a dry run — same gates, no publish — with the version taken from
      # Directory.Build.props so the packed artifacts match what a tag would produce.
      - name: Version from tag (dry run reads Directory.Build.props)
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "PUBLISH=true" >> "$GITHUB_ENV"
          else
            VERSION=$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' Directory.Build.props | head -1)
            if [ -z "$VERSION" ]; then
              echo "::error::Cannot read <Version> from Directory.Build.props for the dry run."
              exit 1
            fi
            echo "VERSION=$VERSION" >> "$GITHUB_ENV"
            echo "PUBLISH=false" >> "$GITHUB_ENV"
            echo "DRY RUN: version $VERSION, nothing will be attested or pushed."
          fi

      # The release notes are this version's CHANGELOG section (via the evidence bundle's
      # claim-changes.md), so a missing section means a release with no notes. Checked HERE, at the
      # top, and not where the notes are used: that step runs after `dotnet nuget push`, and a
      # failure there would leave the packages permanently published with the release unmade.
      # Everything that can refuse a release has to refuse it before anything irreversible happens.
      - name: Verify the CHANGELOG documents this version
        run: |
          if ! grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}]' section - the release would" \
                 "have no notes. Add the section, retag, and push."
            exit 1
          fi
          echo "CHANGELOG.md documents ${VERSION}."

      - name: Build
        run: dotnet build LogicalOptimizer.sln --configuration Release -warnaserror /p:Version=${{ env.VERSION }}

      # The .trx is parsed into the evidence bundle's test-summary.json, so the release's own
      # test counts are part of the published evidence rather than only a workflow log.
      - name: Test
        run: >
          dotnet test LogicalOptimizer.sln --no-build --configuration Release
          --filter "Category!=Performance&Category!=Exhaustive"
          --logger "trx;LogFileName=release.trx" --results-directory TestResults

      # Claim-critical evidence. README and doc/CLAIMS.md cite the exhaustive 4-variable sweeps as
      # what backs the "verified" and "MinimalProven" claims, but those tests are Exhaustive-category
      # and the suite above excludes them - so nothing re-proved them for the commit being published.
      # This gate does, before anything is packed, and its .trx goes into the evidence bundle.
      # ~2 minutes for all 65534 four-variable functions, twice over.
      - name: Claim-critical exhaustive evidence
        run: >
          dotnet test LogicalOptimizer.sln --no-build --configuration Release
          --filter "Category=ReleaseEvidence"
          --logger "trx;LogFileName=release-evidence.trx" --results-directory TestResults
          -- xUnit.ParallelizeTestCollections=false xUnit.DiagnosticMessages=true

      # The .trx files normally travel inside the evidence bundle, but a FAILED test step means
      # the bundle is never built — upload them directly so a refused release is diagnosable.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-test-results
          path: TestResults/**
          if-no-files-found: ignore

      # Nine package IDs: the consolidated library, the CLI tool, and the seven deprecated
      # forwarding shells (doc/decisions/package-consolidation-v4.md).
      - name: Pack
        run: |
          dotnet pack LogicalOptimizer/LogicalOptimizer.csproj -c Release --no-build -o artifacts /p:Version=${{ env.VERSION }}
          dotnet pack LogicalOptimizer.Cli/LogicalOptimizer.Cli.csproj -c Release --no-build -o artifacts /p:Version=${{ env.VERSION }}
          dotnet pack LogicalOptimizer.Full/LogicalOptimizer.Full.csproj -c Release --no-build -o artifacts /p:Version=${{ env.VERSION }}
          dotnet pack forwarding/LogicalOptimizer.Core.Forwarding/LogicalOptimizer.Core.Forwarding.csproj -c Release --no-build -o artifacts /p:Version=${{ env.VERSION }}
          dotnet pack forwarding/LogicalOptimizer.Sat.Forwarding/LogicalOptimizer.Sat.Forwarding.csproj -c Release --no-build -o artifacts /p:Version=${{ env.VERSION }}
          dotnet pack forwarding/LogicalOptimizer.Bdd.Forwarding/LogicalOptimizer.Bdd.Forwarding.csproj -c Release --no-build -o artifacts /p:Version=${{ env.VERSION }}
          dotnet pack forwarding/LogicalOptimizer.Dnnf.Forwarding/LogicalOptimizer.Dnnf.Forwarding.csproj -c Release --no-build -o artifacts /p:Version=${{ env.VERSION }}
          dotnet pack forwarding/LogicalOptimizer.Formats.Forwarding/LogicalOptimizer.Formats.Forwarding.csproj -c Release --no-build -o artifacts /p:Version=${{ env.VERSION }}
          dotnet pack forwarding/LogicalOptimizer.Minimization.Forwarding/LogicalOptimizer.Minimization.Forwarding.csproj -c Release --no-build -o artifacts /p:Version=${{ env.VERSION }}

      # Audit the packed CONTENTS before anything is pushed: a bad package is unpublishable once
      # it is on nuget.org, so the contract (per-package README, distinct description, tags,
      # project/repository URLs, Apache-2.0 expression, symbols with a .pdb, the contracted target
      # frameworks, and no third-party runtime dependency) gates the publish rather than reporting
      # on it afterwards. The report becomes part of the release evidence bundle.
      - name: Verify package contract (pre-publish gate)
        shell: pwsh
        run: pwsh tools/verify_package_contract.ps1 -ArtifactsPath artifacts -Version ${{ env.VERSION }} -ReportPath package-contract-report.json

      # Native AOT link step needs the clang toolchain and zlib headers (same as aot.yml).
      - name: Install Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      # OE-05: every check that can refuse a release runs BEFORE the irreversible push. This
      # installs the freshly packed artifacts from the local folder into throwaway projects
      # outside the repo — library, CLI tool, every forwarding shell — and additionally compiles
      # the consumer natively (PublishAot) and runs the binary. The exact bytes proven here are
      # the bytes pushed below; after the push only visibility checks remain.
      - name: Installation and Native AOT smoke test (local packages, pre-publish gate)
        shell: pwsh
        run: >
          pwsh tools/smoke_install.ps1 -Version ${{ env.VERSION }} -Source artifacts
          -IncludeAot -AotReportPath aot-package-smoke.json

      # Supply-chain evidence for exactly the bytes about to be published.
      # SHA-256 checksums make the artifacts independently comparable; the attestation is a
      # signed, publicly verifiable statement that these packages were built by this workflow
      # from this commit (verify with: gh attestation verify <file> --repo <owner>/<repo>).
      - name: Checksums
        run: |
          cd artifacts
          sha256sum *.nupkg *.snupkg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # OE-05: -RequireAll runs BEFORE the push, on every piece of evidence that can exist
      # pre-publish (contract audit, AOT smoke of the local artifacts, checksums, both .trx).
      # Missing evidence refuses the release here, while it is still refusable. The FINAL
      # bundle is rebuilt after the push with the nuget-index report added — by then the only
      # thing that can be newly wrong is visibility, not the packages.
      - name: Evidence gate (pre-publish, -RequireAll)
        shell: pwsh
        run: >
          pwsh tools/build_evidence_bundle.ps1 -Version ${{ env.VERSION }} -OutputPath evidence-prepush
          -PackageContractReport package-contract-report.json
          -AotReport aot-package-smoke.json
          -TrxPath TestResults/release.trx
          -ExhaustiveTrxPath TestResults/release-evidence.trx
          -ChecksumsPath artifacts/SHA256SUMS.txt
          -BenchmarkManifest doc/comparison
          -Repository ${{ github.repository }}
          -RequireAll

      # A dry run ends here with its evidence uploaded for inspection: everything above ran
      # for real (including the Linux Native AOT smoke of the packed bytes), nothing below does.
      - name: Upload pre-publish evidence (dry run)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dry-run-evidence-${{ env.VERSION }}
          path: |
            evidence-prepush/**
            artifacts/SHA256SUMS.txt
            aot-package-smoke.json
          if-no-files-found: error

      # Attesting is publish-only: an attestation is a public statement about released bytes,
      # and a dry run releases nothing.
      - name: Attest build provenance
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: 'artifacts/*.nupkg'

      - name: Upload packages as run artifacts
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nupkg-${{ env.VERSION }}
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
            artifacts/SHA256SUMS.txt
          if-no-files-found: error

      # Exchange the GitHub OIDC token for a short-lived nuget.org API key (valid ~1 h);
      # requested right before the push so it cannot expire mid-run.
      - name: NuGet login (OIDC → temporary API key)
        if: env.PUBLISH == 'true'
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet
        if: env.PUBLISH == 'true'
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      # Post-push, only VISIBILITY remains to verify: usability of the exact same bytes was
      # proven by the pre-publish gates above (OE-05). Confirm every package ID surfaces in the
      # nuget.org index for this version. Indexing lags behind push (commonly 10-20 min), so the
      # script retries on a ~30-min window before failing — long enough that real indexing lag
      # never reds the release, short enough to still catch a genuine publish failure.
      - name: Verify packages on nuget.org
        if: env.PUBLISH == 'true'
        shell: pwsh
        run: pwsh tools/verify_nuget.ps1 -Version ${{ env.VERSION }} -ReportPath nuget-index-report.json

      # The FINAL bundle an outside reader checks, instead of digging through workflow logs that
      # expire: the pre-push gate's evidence plus the post-push nuget-index report. -RequireAll
      # fails the job if any core piece is missing, so the bundle can never look complete when it
      # is not — but by this point every refusable check has already passed before the push.
      - name: Build release evidence bundle (final, with index report)
        if: env.PUBLISH == 'true'
        shell: pwsh
        run: >
          pwsh tools/build_evidence_bundle.ps1 -Version ${{ env.VERSION }} -OutputPath evidence
          -PackageContractReport package-contract-report.json
          -NuGetIndexReport nuget-index-report.json
          -AotReport aot-package-smoke.json
          -TrxPath TestResults/release.trx
          -ExhaustiveTrxPath TestResults/release-evidence.trx
          -ChecksumsPath artifacts/SHA256SUMS.txt
          -BenchmarkManifest doc/comparison
          -Repository ${{ github.repository }}
          -RequireAll

      - name: Upload evidence bundle as a run artifact
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence-${{ env.VERSION }}
          path: evidence/**
          if-no-files-found: error

      # Attach the bundle AND the packages to the GitHub release for this tag, so both outlive the
      # workflow logs. Only if a release object already exists - this workflow publishes packages,
      # it does not decide when a release is announced.
      #
      # The packages matter as much as the bundle. nuget.org REPOSITORY-SIGNS every package it
      # accepts, which appends ~13 KB and therefore changes its SHA-256. The provenance attestation
      # and SHA256SUMS.txt both describe the bytes this workflow PUSHED, so neither can be verified
      # against a copy downloaded from nuget.org - `gh attestation verify` on such a copy fails with
      # a bare HTTP 404, which reads like a missing attestation rather than a different digest.
      # Attaching the pushed bytes here is what makes "verify it yourself" actually executable;
      # the nuget.org copy is verified instead with `dotnet nuget verify`, which checks that
      # repository signature.
      # This step used to attach only when a release already existed and otherwise print a note and
      # succeed. That made the failure mode silent and the exact opposite of the intent above: v3.2.2
      # published nine packages, went green, and had no release at all - so the "verify it yourself"
      # instructions in the bundle pointed at assets that were never uploaded anywhere. The release
      # is now created when it is missing, and the upload is verified rather than assumed.
      - name: Publish the GitHub release with the evidence bundle and packages
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; attaching to it."
          else
            # Notes are the bundle's claim-changes.md - this version's CHANGELOG section, verbatim,
            # with a link back to it. The early CHANGELOG gate is what guarantees it is non-empty.
            gh release create "$TAG" --title "$TAG" --verify-tag \
              --notes-file evidence/claim-changes.md
            echo "Created release $TAG."
          fi

          zip -r "release-evidence-${VERSION}.zip" evidence
          gh release upload "$TAG" "release-evidence-${VERSION}.zip" --clobber
          # The attested bytes, plus the checksum file that describes them.
          gh release upload "$TAG" artifacts/*.nupkg artifacts/*.snupkg \
            artifacts/SHA256SUMS.txt --clobber

          # Assert what actually landed. `gh release upload` can partially succeed, and an
          # incomplete asset set is precisely what breaks the verification instructions.
          expected=$(( $(ls artifacts/*.nupkg artifacts/*.snupkg artifacts/SHA256SUMS.txt | wc -l) + 1 ))
          actual=$(gh release view "$TAG" --json assets --jq '.assets | length')
          if [ "$actual" -lt "$expected" ]; then
            echo "::error::Release $TAG carries $actual assets, expected at least $expected."
            gh release view "$TAG" --json assets --jq '.assets[].name'
            exit 1
          fi
          echo "Release $TAG published with $actual assets."
