name: Release

# Publishes all NuGet packages (Core/Sat/Bdd/Dnnf/Minimization/Formats + facade + CLI tool +
# the LogicalOptimizer.Full meta-package) when a version tag (v1.2.3) is pushed.
# Uses nuget.org Trusted Publishing (OIDC):
# no stored API key. One-time setup: create a trusted-publishing policy on nuget.org
# (Repository Owner + Repository + Workflow File = release.yml) and set the NUGET_USER
# repository variable to your nuget.org profile name (not your email).
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write      # OIDC token issuance for Trusted Publishing + provenance signing
      contents: write      # checkout + attach the evidence bundle to this tag's release
      attestations: write  # build provenance attestations for the published packages
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build LogicalOptimizer.sln --configuration Release -warnaserror /p:Version=${{ env.VERSION }}

      # The .trx is parsed into the evidence bundle's test-summary.json, so the release's own
      # test counts are part of the published evidence rather than only a workflow log.
      - name: Test
        run: >
          dotnet test LogicalOptimizer.sln --no-build --configuration Release
          --filter "Category!=Performance&Category!=Exhaustive"
          --logger "trx;LogFileName=release.trx" --results-directory TestResults

      # Claim-critical evidence. README and doc/CLAIMS.md cite the exhaustive 4-variable sweeps as
      # what backs the "verified" and "MinimalProven" claims, but those tests are Exhaustive-category
      # and the suite above excludes them - so nothing re-proved them for the commit being published.
      # This gate does, before anything is packed, and its .trx goes into the evidence bundle.
      # ~2 minutes for all 65534 four-variable functions, twice over.
      - name: Claim-critical exhaustive evidence
        run: >
          dotnet test LogicalOptimizer.sln --no-build --configuration Release
          --filter "Category=ReleaseEvidence"
          --logger "trx;LogFileName=release-evidence.trx" --results-directory TestResults

      - name: Pack
        run: |
          dotnet pack LogicalOptimizer.Core/LogicalOptimizer.Core.csproj -c Release --no-build -o artifacts /p:Version=${{ env.VERSION }}
          dotnet pack LogicalOptimizer.Sat/LogicalOptimizer.Sat.csproj -c Release --no-build -o artifacts /p:Version=${{ env.VERSION }}
          dotnet pack LogicalOptimizer.Bdd/LogicalOptimizer.Bdd.csproj -c Release --no-build -o artifacts /p:Version=${{ env.VERSION }}
          dotnet pack LogicalOptimizer.Dnnf/LogicalOptimizer.Dnnf.csproj -c Release --no-build -o artifacts /p:Version=${{ env.VERSION }}
          dotnet pack LogicalOptimizer.Formats/LogicalOptimizer.Formats.csproj -c Release --no-build -o artifacts /p:Version=${{ env.VERSION }}
          dotnet pack LogicalOptimizer.Minimization/LogicalOptimizer.Minimization.csproj -c Release --no-build -o artifacts /p:Version=${{ env.VERSION }}
          dotnet pack LogicalOptimizer/LogicalOptimizer.csproj -c Release --no-build -o artifacts /p:Version=${{ env.VERSION }}
          dotnet pack LogicalOptimizer.Cli/LogicalOptimizer.Cli.csproj -c Release --no-build -o artifacts /p:Version=${{ env.VERSION }}
          dotnet pack LogicalOptimizer.Full/LogicalOptimizer.Full.csproj -c Release --no-build -o artifacts /p:Version=${{ env.VERSION }}

      # Audit the packed CONTENTS before anything is pushed: a bad package is unpublishable once
      # it is on nuget.org, so the contract (per-package README, distinct description, tags,
      # project/repository URLs, Apache-2.0 expression, symbols with a .pdb, the contracted target
      # frameworks, and no third-party runtime dependency) gates the publish rather than reporting
      # on it afterwards. The report becomes part of the release evidence bundle.
      - name: Verify package contract (pre-publish gate)
        shell: pwsh
        run: pwsh tools/verify_package_contract.ps1 -ArtifactsPath artifacts -Version ${{ env.VERSION }} -ReportPath package-contract-report.json

      # Supply-chain evidence for exactly the bytes about to be published.
      # SHA-256 checksums make the artifacts independently comparable; the attestation is a
      # signed, publicly verifiable statement that these packages were built by this workflow
      # from this commit (verify with: gh attestation verify <file> --repo <owner>/<repo>).
      - name: Checksums
        run: |
          cd artifacts
          sha256sum *.nupkg *.snupkg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'artifacts/*.nupkg'

      - name: Upload packages as run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nupkg-${{ env.VERSION }}
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
            artifacts/SHA256SUMS.txt
          if-no-files-found: error

      # Exchange the GitHub OIDC token for a short-lived nuget.org API key (valid ~1 h);
      # requested right before the push so it cannot expire mid-run.
      - name: NuGet login (OIDC → temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      # Confirm the nine packages actually surface in the nuget.org index for this version.
      # Indexing lags behind push (commonly 10-20 min), so the script retries on a ~30-min
      # window before failing — long enough that real indexing lag never reds the release,
      # short enough to still catch a genuine publish failure.
      - name: Verify packages on nuget.org
        shell: pwsh
        run: pwsh tools/verify_nuget.ps1 -Version ${{ env.VERSION }} -ReportPath nuget-index-report.json

      # Native AOT link step needs the clang toolchain and zlib headers (same as aot.yml).
      - name: Install Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      # Presence in the index does not prove usability, so install the PUBLISHED package into a
      # throwaway project outside the repo and assert the library and the CLI tool really work.
      # -IncludeAot additionally compiles that consumer program with PublishAot and runs the native
      # binary: aot.yml only proves AOT compatibility through an in-repo PROJECT REFERENCE, which
      # cannot catch a packaging-level AOT break.
      - name: Installation and Native AOT smoke test (published packages)
        shell: pwsh
        run: >
          pwsh tools/smoke_install.ps1 -Version ${{ env.VERSION }}
          -IncludeAot -AotReportPath aot-package-smoke.json

      # One place an outside reader can check every claim of this release, instead of digging
      # through workflow logs that expire. -RequireAll fails the job if any core piece of evidence
      # is missing, so the bundle can never look complete when it is not.
      - name: Build release evidence bundle
        shell: pwsh
        run: >
          pwsh tools/build_evidence_bundle.ps1 -Version ${{ env.VERSION }} -OutputPath evidence
          -PackageContractReport package-contract-report.json
          -NuGetIndexReport nuget-index-report.json
          -AotReport aot-package-smoke.json
          -TrxPath TestResults/release.trx
          -ExhaustiveTrxPath TestResults/release-evidence.trx
          -ChecksumsPath artifacts/SHA256SUMS.txt
          -BenchmarkManifest doc/comparison
          -Repository ${{ github.repository }}
          -RequireAll

      - name: Upload evidence bundle as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ env.VERSION }}
          path: evidence/**
          if-no-files-found: error

      # Attach the bundle to the GitHub release for this tag so it outlives the workflow logs.
      # Only if a release object already exists - this workflow publishes packages, it does not
      # decide when a release is announced.
      - name: Attach evidence bundle to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            zip -r "release-evidence-${VERSION}.zip" evidence
            gh release upload "$TAG" "release-evidence-${VERSION}.zip" --clobber
            echo "Evidence bundle attached to release $TAG."
          else
            echo "No GitHub release exists for $TAG yet; the bundle is available as the"
            echo "release-evidence-${VERSION} run artifact and can be attached when the release is published."
          fi
