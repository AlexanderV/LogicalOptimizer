name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    # A hung test run must terminate with diagnostics, not consume the 6-hour runner default.
    # --blame-hang below fires first (20 min) and names the active tests; this is the backstop.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore LogicalOptimizer.sln

      # External differential oracle: SymPyDifferentialTests cross-checks our exact
      # minimizer against SymPy's Quine-McCluskey.
      - name: Install SymPy oracle
        id: sympy
        run: pip install sympy
        continue-on-error: true

      # If the install SUCCEEDED, the oracle becomes mandatory for the rest of the job: without
      # this, a sympy that stops importing leaves SymPyDifferentialTests reporting Passed while
      # asserting nothing, and the external half of the differential technique disappears with no
      # red test anywhere. A genuine install failure (registry outage) stays non-fatal — the step
      # above is visibly failed in the log and the flag is simply not set.
      - name: Require the SymPy oracle when it installed
        if: steps.sympy.outcome == 'success'
        run: echo "LOGICALOPTIMIZER_REQUIRE_SYMPY=1" >> "$GITHUB_ENV"

      - name: Format check
        run: dotnet format LogicalOptimizer.sln --verify-no-changes --no-restore

      - name: Build (warnings as errors)
        run: dotnet build LogicalOptimizer.sln --no-restore --configuration Release -warnaserror

      # Timing-sensitive and exhaustive-sweep tests are excluded on shared CI runners.
      # Run them locally with tools/test.ps1 -Performance / -Exhaustive (sequential on
      # purpose — see doc/TESTING.md Part 0). The Exhaustive category also runs nightly
      # in exhaustive.yml and gates releases via its ReleaseEvidence subset.
      # Coverage threshold: build fails if line coverage of the library drops below 80%
      # --blame-hang turns a wedged run into a failed one WITH a sequence file naming the
      # tests that were still executing — the artifact below keeps it (and the .trx) even
      # when the step fails, so a red or hung run is diagnosable from the workflow page.
      - name: Test
        run: dotnet test LogicalOptimizer.sln --no-build --configuration Release --filter "Category!=Performance&Category!=Exhaustive" --logger "trx" --results-directory TestResults --blame-hang --blame-hang-timeout 20m /p:CollectCoverage=true /p:Include="[LogicalOptimizer]*" /p:Threshold=80 /p:ThresholdType=line /p:ThresholdStat=total

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/**
          if-no-files-found: ignore

      # The runnable recipes double as an integration smoke test of the public API: each
      # recipe asserts its own output, so a non-zero exit here means a documented sample
      # stopped producing the result its README claims.
      - name: Run samples (verify recipes)
        run: dotnet run --project samples/LogicalOptimizer.Samples/LogicalOptimizer.Samples.csproj --configuration Release --no-build

      # Roadmap B2: emit the SymPy/PyEDA comparison table into the CI log where the
      # tools exist (sympy installed above; pyeda best-effort). Linux-only: the script's
      # per-function timeout relies on SIGALRM, which does not exist on Windows, so a slow
      # PyEDA espresso call there could stall until the step timeout. Non-gating and capped
      # (var count + per-function timeout + step timeout) so it can never slow or fail the gate.
      - name: Comparison table (LogicalOptimizer vs SymPy/PyEDA, non-gating)
        if: runner.os == 'Linux'
        continue-on-error: true
        timeout-minutes: 6
        run: |
          dotnet run -c Release --project LogicalOptimizer.Benchmarks -- compare
          dotnet run -c Release --project LogicalOptimizer.Benchmarks -- compare --dnf
          python -m pip install pyeda || true
          python tools/compare_sympy_pyeda.py --max-vars 14 --timeout 10

      # All nine package IDs must always be packable: the consolidated library, the CLI tool,
      # and the seven deprecated forwarding shells (doc/decisions/package-consolidation-v4.md).
      - name: Pack (verification)
        run: |
          dotnet pack LogicalOptimizer/LogicalOptimizer.csproj -c Release --no-build -o artifacts
          dotnet pack LogicalOptimizer.Cli/LogicalOptimizer.Cli.csproj -c Release --no-build -o artifacts
          dotnet pack LogicalOptimizer.Full/LogicalOptimizer.Full.csproj -c Release --no-build -o artifacts
          dotnet pack forwarding/LogicalOptimizer.Core.Forwarding/LogicalOptimizer.Core.Forwarding.csproj -c Release --no-build -o artifacts
          dotnet pack forwarding/LogicalOptimizer.Sat.Forwarding/LogicalOptimizer.Sat.Forwarding.csproj -c Release --no-build -o artifacts
          dotnet pack forwarding/LogicalOptimizer.Bdd.Forwarding/LogicalOptimizer.Bdd.Forwarding.csproj -c Release --no-build -o artifacts
          dotnet pack forwarding/LogicalOptimizer.Dnnf.Forwarding/LogicalOptimizer.Dnnf.Forwarding.csproj -c Release --no-build -o artifacts
          dotnet pack forwarding/LogicalOptimizer.Formats.Forwarding/LogicalOptimizer.Formats.Forwarding.csproj -c Release --no-build -o artifacts
          dotnet pack forwarding/LogicalOptimizer.Minimization.Forwarding/LogicalOptimizer.Minimization.Forwarding.csproj -c Release --no-build -o artifacts

      # Packable is not the same as correct: a package can pack cleanly and still ship a missing
      # README, an empty description, no license expression, no symbols, or an unexpected
      # third-party dependency. Auditing the packed CONTENTS here means a metadata regression
      # fails the pull request instead of surfacing on a nuget.org package page after release.
      # Linux only - the packed bytes are identical across runners, so once is enough.
      - name: Verify package contract
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).SelectSingleNode('//Version').InnerText
          Write-Host "Auditing packages at version $version"
          pwsh tools/verify_package_contract.ps1 -ArtifactsPath artifacts -Version $version -ReportPath package-contract-report.json

      - name: Upload package contract report
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-contract-report
          path: package-contract-report.json
          if-no-files-found: ignore
