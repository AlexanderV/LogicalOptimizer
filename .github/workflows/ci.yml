name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore LogicalOptimizer.sln

      # External differential oracle: SymPyDifferentialTests cross-checks our exact
      # minimizer against SymPy's Quine-McCluskey (skips silently where unavailable)
      - name: Install SymPy oracle
        run: pip install sympy
        continue-on-error: true

      - name: Format check
        run: dotnet format LogicalOptimizer.sln --verify-no-changes --no-restore

      - name: Build (warnings as errors)
        run: dotnet build LogicalOptimizer.sln --no-restore --configuration Release -warnaserror

      # Timing-sensitive and exhaustive-sweep tests are excluded on shared CI runners.
      # Run them locally with:
      #   dotnet test --filter "Category=Performance"
      #   dotnet test --filter "Category=Exhaustive"   (~minutes: all 65k 4-variable functions)
      # Coverage threshold: build fails if line coverage of the library drops below 80%
      - name: Test
        run: dotnet test LogicalOptimizer.sln --no-build --configuration Release --filter "Category!=Performance&Category!=Exhaustive" --logger "trx" /p:CollectCoverage=true /p:Include="[LogicalOptimizer]*" /p:Threshold=80 /p:ThresholdType=line /p:ThresholdStat=total

      # Roadmap B2: emit the SymPy/PyEDA comparison table into the CI log where the
      # tools exist (sympy installed above; pyeda best-effort). Non-gating and capped
      # so it can never slow or fail the PR gate; the script self-skips absent tools.
      - name: Comparison table (SymPy/PyEDA, non-gating)
        continue-on-error: true
        run: |
          python -m pip install pyeda || true
          python tools/compare_sympy_pyeda.py --max-vars 16

      # All six NuGet packages must always be packable
      - name: Pack (verification)
        run: |
          dotnet pack LogicalOptimizer.Core/LogicalOptimizer.Core.csproj -c Release --no-build -o artifacts
          dotnet pack LogicalOptimizer.Sat/LogicalOptimizer.Sat.csproj -c Release --no-build -o artifacts
          dotnet pack LogicalOptimizer.Bdd/LogicalOptimizer.Bdd.csproj -c Release --no-build -o artifacts
          dotnet pack LogicalOptimizer.Minimization/LogicalOptimizer.Minimization.csproj -c Release --no-build -o artifacts
          dotnet pack LogicalOptimizer/LogicalOptimizer.csproj -c Release --no-build -o artifacts
          dotnet pack LogicalOptimizer.Cli/LogicalOptimizer.Cli.csproj -c Release --no-build -o artifacts
