name: Docs

# Builds the DocFX documentation site (API reference from the seven library packages'
# XML doc comments + conceptual articles) and deploys it to GitHub Pages.
# The CLI tool and the Full meta-package deliberately have no API reference (a tool is
# driven from the shell, a meta-package ships no assembly — see docs-site/api/index.md),
# but their directories still trigger a rebuild: both are covered by conceptual articles.
#
# One-time setup by a repo admin: Settings -> Pages -> "Build and deployment" ->
# Source = "GitHub Actions". No secrets are required.
on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      # The CLI report JSON Schema is served from the site at the $id it declares.
      - 'schema/**'
      - 'LogicalOptimizer.Core/**'
      - 'LogicalOptimizer.Sat/**'
      - 'LogicalOptimizer.Bdd/**'
      - 'LogicalOptimizer.Dnnf/**'
      - 'LogicalOptimizer.Formats/**'
      - 'LogicalOptimizer.Minimization/**'
      - 'LogicalOptimizer/**'
      - 'LogicalOptimizer.Cli/**'
      - 'LogicalOptimizer.Full/**'
      # DocFX is version-pinned in the tool manifest; bumping it must rebuild the site.
      - '.config/dotnet-tools.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Allow the deploy job to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Serialize Pages deployments; do not cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      # DocFX drives a `dotnet build` of the seven library projects to extract API
      # metadata from their XML doc comments, so restore first.
      - name: Restore
        run: dotnet restore LogicalOptimizer.sln

      # Version-pinned via .config/dotnet-tools.json: an unpinned `tool install -g docfx`
      # took whatever was latest that day, so the site could break or change rendering
      # with no change in this repository. Upgrades are a deliberate manifest PR now.
      - name: Restore DocFX (pinned by the tool manifest)
        run: dotnet tool restore

      # The CLI report JSON Schema declares $id https://<site>/schema/cli-report-v1.schema.json,
      # so it has to be served from exactly that path. Staged into the site's resource tree here
      # rather than committed twice; schema/ is the single source of truth.
      - name: Stage the CLI report JSON Schema
        run: |
          mkdir -p docs-site/schema/examples
          cp schema/*.json docs-site/schema/
          cp schema/examples/*.json docs-site/schema/examples/

      - name: Build documentation site
        run: dotnet docfx docs-site/docfx.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs-site/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
